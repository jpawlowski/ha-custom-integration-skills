# Hooks are run by prek (https://github.com/j178/prek); install them with `prek install`.
default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  - repo: local
    hooks:
      - id: push-gate
        name: push gate (script/check on the pushed HEAD)
        entry: script/push-gate
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
